apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onlyoffice.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "onlyoffice.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app: {{ include "onlyoffice.fullname" . }}
  template:
    metadata:
      # Le template reste volontairement minimal : y ajouter un label provoque
      # un redéploiement. Les labels standard viendront dans un commit séparé.
      labels:
        app: {{ include "onlyoffice.fullname" . }}
    spec:
      containers:
        - name: documentserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "onlyoffice.jwtSecretName" . }}
                  key: {{ .Values.jwt.key }}
            - name: ALLOW_PRIVATE_IP_ADDRESS
              value: {{ .Values.env.allowPrivateIpAddress | quote }}
            - name: PLUGINS_ENABLED
              value: {{ .Values.env.pluginsEnabled | quote }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
