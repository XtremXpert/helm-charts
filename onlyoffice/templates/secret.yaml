{{- if not .Values.jwt.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "onlyoffice.jwtSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "onlyoffice.fullname" . }}
  annotations:
    # Ne pas supprimer avec la release : la clé doit survivre à une réinstallation.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.jwt.key }}: {{ .Values.jwt.secret | default (randAlphaNum 32) | b64enc | quote }}
{{- end }}
