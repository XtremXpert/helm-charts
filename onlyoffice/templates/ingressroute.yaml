{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "onlyoffice.fullname" . }}-redirect-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "onlyoffice.fullname" . }}-headers
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "onlyoffice.fullname" . }}-http
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.hostname }}`)
      middlewares:
        - name: {{ include "onlyoffice.fullname" . }}-redirect-https
      services:
        - kind: Service
          name: {{ include "onlyoffice.fullname" . }}
          port: {{ .Values.service.port }}
          scheme: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "onlyoffice.fullname" . }}-https
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.hostname }}`)
      priority: 10
      middlewares:
        - name: {{ include "onlyoffice.fullname" . }}-headers
      services:
        - kind: Service
          name: {{ include "onlyoffice.fullname" . }}
          port: {{ .Values.service.port }}
          scheme: http
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
